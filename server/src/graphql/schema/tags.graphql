# Tag data type
type Tags {
  id: ID!
  tag: String!
}

# BookTagRelations data type
type BookTagRelations {
  id: ID!
  bookID: ID!
  tagID: ID!
}

# input data for link Book with Tag
input BookTagRelationsInput {
  bookID: ID!
  tagID: [ID!]!
}

extend type Query {
  # Get all tags
  getAllTags: [Tags!]!
}

extend type Mutation {
  # link Book with Tag
  linkBookWithTag(input: BookTagRelationsInput!): Book!
}
